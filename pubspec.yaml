name: shiftsnap
description: Scan printed duty rosters into a shift calendar using Gemini AI.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Local storage (community fork of Hive)
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.0

  # AI / Gemini
  google_generative_ai: ^0.4.7

  # Camera
  camera: ^0.11.0+2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utilities
  flutter_dotenv: ^5.2.1
  image: ^4.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  device_preview: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  hive_ce_generator: ^1.10.0
  riverpod_generator: ^3.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true
